[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "m365-mcp-server"
version = "0.1.0"
description = "An enterprise Microsoft 365 MCP server based on Microsoft Graph."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "fastmcp>=2.10.5,<3",
    "httpx>=0.28,<1",
    "msal>=1.31,<2",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.6,<3",
    "PyJWT[crypto]>=2.9,<3",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
]

[project.scripts]
m365-mcp-server = "m365_mcp.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

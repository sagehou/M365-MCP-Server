[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "m365-mcp-server"
version = "0.1.5"
description = "An enterprise Microsoft 365 MCP server based on Microsoft Graph."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "cryptography==50.0.2",
    "fastapi==0.162.4",
    "fastmcp==4.1.8",
    "httpx==0.28.1",
    "msal==1.39.0",
    "pypdf==7.0.1",
    "python-docx==1.2.0",
    "openpyxl==3.1.5",
    "python-pptx==1.0.2",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "PyJWT[crypto]==2.15.1",
    "uvicorn[standard]==0.54.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pip-audit==2.10.1",
]

[project.scripts]
m365-mcp-server = "m365_mcp.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

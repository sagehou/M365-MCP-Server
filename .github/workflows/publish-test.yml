name: Publish test container

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/sagehou/m365-mcp-server

jobs:
  test-and-publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test candidate
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          load: true
          tags: m365-mcp-server:test

      - name: Smoke test exact candidate
        run: bash scripts/smoke-container.sh m365-mcp-server:test

      - name: Publish test image
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::12}"
          edge_tag="${IMAGE_NAME}:edge"
          sha_tag="${IMAGE_NAME}:sha-${short_sha}"

          docker tag m365-mcp-server:test "$edge_tag"
          docker tag m365-mcp-server:test "$sha_tag"
          docker push "$edge_tag"
          docker push "$sha_tag"

          echo "Published:"
          echo "  $edge_tag"
          echo "  $sha_tag"

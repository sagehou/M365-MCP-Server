name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check bilingual documentation
        run: python scripts/check-doc-i18n.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest

  build-image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build --file docker/Dockerfile --tag m365-mcp-server:ci .
      - name: Smoke test container health endpoint
        shell: bash
        run: bash scripts/smoke-container.sh m365-mcp-server:ci
      - name: Validate Compose configuration
        env:
          M365_MCP_IMAGE: m365-mcp-server:ci
        run: |
          cp deploy/.env.example deploy/.env
          docker compose --env-file deploy/.env -f deploy/docker-compose.yml config --quiet

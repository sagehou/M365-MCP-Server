name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Setup Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          check-latest: true
      - name: Check bilingual documentation
        run: python scripts/check-doc-i18n.py
      - name: Install dependencies
        run: |
          python -m pip install uv==0.13.7
          uv sync --frozen --extra dev
      - name: Report resolved runtime dependencies
        run: uv run --frozen --extra dev python scripts/report-runtime-dependencies.py
      - name: Audit dependencies
        run: uv run --frozen --extra dev pip-audit --skip-editable
      - name: Check imports and undefined names
        run: uvx --from ruff==0.17.4 ruff check --select F401,F811,F821 src scripts tests
      - name: Check unreachable code and unused variables
        run: uvx --from vulture==2.16 vulture src scripts --min-confidence 100
      - name: Run tests
        run: uv run --frozen --extra dev pytest

  build-image:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build Docker image
        run: docker build --file docker/Dockerfile --tag m365-mcp-server:ci .
      - name: Scan container dependencies
        run: >
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          ghcr.io/aquasecurity/trivy:0.76.2 image
          --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed
          --exit-code 1 m365-mcp-server:ci
      - name: Smoke test container health endpoint
        shell: bash
        run: bash scripts/smoke-container.sh m365-mcp-server:ci
      - name: Validate Compose configuration
        env:
          M365_MCP_IMAGE: m365-mcp-server:ci
        run: |
          cp deploy/.env.example deploy/.env
          docker compose --env-file deploy/.env -f deploy/docker-compose.yml config --quiet

name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/sagehou/m365-mcp-server

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          check-latest: true
      - name: Validate stable release tag and reviewed ancestry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          PROJECT_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$RELEASE_TAG" = "v$PROJECT_VERSION"
          test -s "docs/releases/$RELEASE_TAG.md"
          test -s "docs/zh-CN/releases/$RELEASE_TAG.md"
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Check bilingual documentation
        run: python scripts/check-doc-i18n.py
      - name: Install dependencies
        run: |
          python -m pip install uv==0.13.7
          uv sync --frozen --extra dev
      - name: Run tests
        run: uv run --frozen --extra dev pytest
      - name: Audit dependencies
        run: uv run --frozen --extra dev pip-audit --skip-editable
      - name: Check code hygiene
        run: |
          uvx --from ruff==0.17.4 ruff check --select F401,F811,F821 src scripts tests
          uvx --from vulture==2.16 vulture src scripts --min-confidence 100

  windows:
    needs: test
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Setup .NET
        uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: '10.0.x'
      - name: Check all local tools with mocked Graph and Windows DPAPI
        shell: pwsh
        run: dotnet run --project windows/M365Mcp.Local.Checks --configuration Release
      - name: Publish native single executable
        shell: pwsh
        run: >
          dotnet publish windows/M365Mcp.Local/M365Mcp.Local.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output artifacts/windows-local-amd64
          -p:TreatWarningsAsErrors=true
      - name: Verify single-file output
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $publish = (Resolve-Path 'artifacts/windows-local-amd64').Path
          $files = @(Get-ChildItem -LiteralPath $publish -File)
          if ($files.Count -ne 1 -or $files[0].Name -ne 'm365-mcp-windows-local-amd64.exe') {
            throw "Expected exactly one m365-mcp-windows-local-amd64.exe output; found: $($files.Name -join ', ')"
          }
          $expectedVersion = $env:RELEASE_TAG -replace '^v', ''
          & ./scripts/verify-windows-version-info.ps1 -Path $files[0].FullName -Edition NativeAOT -Version $expectedVersion
          $hash = (Get-FileHash -LiteralPath $files[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "Built m365-mcp-windows-local-amd64.exe SHA-256 $hash"
      - name: Smoke test exact Windows release candidate
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $exe = (Resolve-Path 'artifacts/windows-local-amd64/m365-mcp-windows-local-amd64.exe').Path
          $expectedVersion = $env:RELEASE_TAG -replace '^v', ''
          $smokeRoot = Join-Path $env:RUNNER_TEMP "m365-local-release-smoke"
          New-Item -ItemType Directory -Path $smokeRoot -Force | Out-Null
          $env:TEMP = $smokeRoot
          $env:TMP = $smokeRoot
          $env:LOCALAPPDATA = Join-Path $smokeRoot 'local'
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"

          $version = & $exe --version
          if ($LASTEXITCODE -ne 0 -or $version -ne "m365-mcp $expectedVersion") {
            throw "Version option failed: $version"
          }

          $doctor = & $exe doctor --ephemeral | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $doctor.ok -or -not $doctor.ephemeral) {
            throw 'Ephemeral doctor check failed.'
          }
          if (
            -not $doctor.client_id_configured `
            -or $doctor.client_id -ne '6e35216e-2623-43cc-b867-83bec0865cf3' `
            -or $doctor.client_id_source -ne 'built_in'
          ) {
            throw 'Built-in Windows client ID was not selected by default.'
          }

          $requests = @(
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"release-ci","version":"1"}}}',
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}',
            '{"jsonrpc":"2.0","id":3,"method":"ping","params":{}}'
          )
          $responses = @($requests | & $exe stdio --ephemeral)
          if ($LASTEXITCODE -ne 0 -or $responses.Count -ne 3) {
            throw "stdio smoke test failed with $($responses.Count) responses."
          }
          $initialize = $responses[0] | ConvertFrom-Json
          $tools = $responses[1] | ConvertFrom-Json
          $ping = $responses[2] | ConvertFrom-Json
          if ($initialize.result.serverInfo.name -ne 'M365 MCP Server (Windows Local)') {
            throw 'Unexpected MCP server identity.'
          }
          if (@($tools.result.tools).Count -ne 11) {
            throw "Expected 11 local mail tools; found $(@($tools.result.tools).Count)."
          }
          if ($ping.id -ne 3 -or $null -eq $ping.result) {
            throw 'stdio ping failed.'
          }

          $unexpected = @(Get-ChildItem -LiteralPath $smokeRoot -Recurse -File -ErrorAction SilentlyContinue)
          if ($unexpected.Count -ne 0) {
            throw "Ephemeral runtime created undeclared files: $($unexpected.FullName -join ', ')"
          }
      - name: Prepare Windows release assets
        shell: pwsh
        run: |
          $releaseDir = New-Item -ItemType Directory -Path 'artifacts/release' -Force
          $source = (Resolve-Path 'artifacts/windows-local-amd64/m365-mcp-windows-local-amd64.exe').Path
          $asset = Join-Path $releaseDir.FullName 'm365-mcp-windows-local-amd64.exe'
          Copy-Item -LiteralPath $source -Destination $asset
          Copy-Item -LiteralPath 'LICENSE' -Destination (Join-Path $releaseDir.FullName 'LICENSE')
          $hash = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  m365-mcp-windows-local-amd64.exe" | Set-Content -LiteralPath (Join-Path $releaseDir.FullName 'm365-mcp-windows-local-amd64.exe.sha256') -Encoding ascii -NoNewline
          Write-Host "Release asset SHA-256: $hash"
      - name: Upload Windows release assets
        uses: actions/upload-artifact@v7.0.2
        with:
          name: m365-mcp-windows-local-amd64-release
          path: |
            artifacts/release/m365-mcp-windows-local-amd64.exe
            artifacts/release/m365-mcp-windows-local-amd64.exe.sha256
            artifacts/release/LICENSE
          if-no-files-found: error
          retention-days: 14

  windows-go:
    needs: test
    uses: ./.github/workflows/windows-local-go.yml
    permissions:
      contents: read

  attest-windows:
    needs:
      - test
      - windows
      - windows-go
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Download Windows release assets
        uses: actions/download-artifact@v8.0.2
        with:
          name: m365-mcp-windows-local-amd64-release
          path: release-assets
      - name: Download Go Windows release assets
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: windows-local-go-*
          merge-multiple: true
          path: release-assets
      - name: Verify Windows checksum
        run: |
          cd release-assets
          cat m365-mcp-windows-local-amd64.exe.sha256 >> SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - name: Attest Windows release executable
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: release-assets/*.exe

  publish:
    needs:
      - test
      - windows
      - windows-go
      - attest-windows
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Download Windows release assets
        uses: actions/download-artifact@v8.0.2
        with:
          name: m365-mcp-windows-local-amd64-release
          path: release-assets
      - name: Download Go Windows release assets
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: windows-local-go-*
          merge-multiple: true
          path: release-assets
      - name: Package shared mail Skill
        run: |
          git archive --format=zip --prefix=m365-mail/ \
            --output=release-assets/m365-mail-skill.zip \
            "${GITHUB_SHA}:workbuddy/skills/m365-mail"
          cd release-assets
          sha256sum m365-mail-skill.zip >> SHA256SUMS.txt
      - name: Verify release checksums
        run: |
          cd release-assets
          cat m365-mcp-windows-local-amd64.exe.sha256 >> SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - name: Add exact Windows asset hashes to release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/render_windows_release_hashes.py \
            --binary release-assets/m365-mcp-windows-local-amd64.exe \
            --sha256-file release-assets/m365-mcp-windows-local-amd64.exe.sha256 \
            --binary release-assets/m365-mcp-windows-local-go-amd64.exe \
            --sha256-file release-assets/m365-mcp-windows-local-go-amd64.exe.sha256 \
            --binary release-assets/m365-mcp-windows-local-go-arm64.exe \
            --sha256-file release-assets/m365-mcp-windows-local-go-arm64.exe.sha256 \
            --notes-in "docs/releases/$RELEASE_TAG.md" \
            --notes-zh-in "docs/zh-CN/releases/$RELEASE_TAG.md" \
            --notes-out release-assets/release-notes.md \
            --release-tag "$RELEASE_TAG"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Build release candidate
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./docker/Dockerfile
          load: true
          pull: true
          platforms: linux/amd64
          tags: m365-mcp-server:release
          labels: ${{ steps.meta.outputs.labels }}
      - name: Smoke test exact release candidate
        run: bash scripts/smoke-container.sh m365-mcp-server:release
      - name: Scan exact release candidate
        run: bash scripts/scan-container.sh m365-mcp-server:release
      - name: Validate Compose configuration
        env:
          M365_MCP_IMAGE: m365-mcp-server:release
        run: |
          cp deploy/.env.example deploy/.env
          docker compose --env-file deploy/.env -f deploy/docker-compose.yml config --quiet
      - name: Push the tested image
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            docker tag m365-mcp-server:release "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
      - name: Create GitHub Release with Windows and Skill assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            release-assets/m365-mcp-windows-local-amd64.exe \
            release-assets/m365-mcp-windows-local-amd64.exe.sha256 \
            release-assets/m365-mcp-windows-local-go-amd64.exe \
            release-assets/m365-mcp-windows-local-go-amd64.exe.sha256 \
            release-assets/m365-mcp-windows-local-go-arm64.exe \
            release-assets/m365-mcp-windows-local-go-arm64.exe.sha256 \
            release-assets/m365-mcp-windows-local-go-amd64.zip \
            release-assets/m365-mcp-windows-local-go-arm64.zip \
            release-assets/m365-mail-skill.zip \
            release-assets/SHA256SUMS.txt \
            release-assets/LICENSE \
            --verify-tag \
            --title "M365 MCP Server $RELEASE_TAG" \
            --notes-file release-assets/release-notes.md \
            --latest

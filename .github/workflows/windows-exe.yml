name: Windows local executable

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-windows-local:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Publish native single executable
        shell: pwsh
        run: >
          dotnet publish windows/M365Mcp.Local/M365Mcp.Local.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output artifacts/windows-x64
          -p:TreatWarningsAsErrors=true
      - name: Verify single-file output
        id: artifact
        shell: pwsh
        run: |
          $publish = (Resolve-Path 'artifacts/windows-x64').Path
          $files = @(Get-ChildItem -LiteralPath $publish -File)
          if ($files.Count -ne 1 -or $files[0].Name -ne 'm365-mcp.exe') {
            throw "Expected exactly one m365-mcp.exe output; found: $($files.Name -join ', ')"
          }
          $hash = (Get-FileHash -LiteralPath $files[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          "Built m365-mcp.exe SHA-256 $hash"
      - name: Smoke test without runtime or extraction directory
        shell: pwsh
        env:
          M365_LOCAL_CLIENT_ID: 11111111-1111-1111-1111-111111111111
          M365_LOCAL_TENANT_ID: organizations
        run: |
          $exe = (Resolve-Path 'artifacts/windows-x64/m365-mcp.exe').Path
          $smokeRoot = Join-Path $env:RUNNER_TEMP "m365-local-smoke"
          New-Item -ItemType Directory -Path $smokeRoot -Force | Out-Null
          $env:TEMP = $smokeRoot
          $env:TMP = $smokeRoot
          $env:LOCALAPPDATA = Join-Path $smokeRoot 'local'
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"

          $version = & $exe --version
          if ($LASTEXITCODE -ne 0 -or $version -ne 'm365-mcp 0.1.0') {
            throw "Version option failed: $version"
          }

          $doctor = & $exe doctor --ephemeral | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $doctor.ok -or -not $doctor.ephemeral) {
            throw 'Ephemeral doctor check failed.'
          }

          $requests = @(
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}',
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}',
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":42,"arguments":{}}}',
            '{"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"mail_mark_read","arguments":{"message_id":"test","is_read":"true"}}}',
            '{"jsonrpc":"2.0","id":5,"method":"ping","params":{}}'
          )
          $responses = @($requests | & $exe stdio --ephemeral)
          if ($LASTEXITCODE -ne 0 -or $responses.Count -ne 5) {
            throw "stdio smoke test failed with $($responses.Count) responses."
          }
          $initialize = $responses[0] | ConvertFrom-Json
          $tools = $responses[1] | ConvertFrom-Json
          $invalidName = $responses[2] | ConvertFrom-Json
          $invalidBoolean = $responses[3] | ConvertFrom-Json
          $ping = $responses[4] | ConvertFrom-Json
          if ($initialize.result.serverInfo.name -ne 'M365 MCP Server (Windows Local)') {
            throw 'Unexpected MCP server identity.'
          }
          if (@($tools.result.tools).Count -ne 10) {
            throw "Expected 10 local mail tools; found $(@($tools.result.tools).Count)."
          }
          if (-not $invalidName.result.isError -or -not $invalidBoolean.result.isError) {
            throw 'Invalid tool argument handling failed.'
          }
          if ($ping.id -ne 5 -or $null -eq $ping.result) {
            throw 'stdio server did not continue after invalid tool arguments.'
          }

          $unexpected = @(Get-ChildItem -LiteralPath $smokeRoot -Recurse -File -ErrorAction SilentlyContinue)
          if ($unexpected.Count -ne 0) {
            throw "Ephemeral runtime created undeclared files: $($unexpected.FullName -join ', ')"
          }
      - name: Upload Windows executable
        uses: actions/upload-artifact@v6
        with:
          name: m365-mcp-windows-x64
          path: artifacts/windows-x64/m365-mcp.exe
          if-no-files-found: error
          retention-days: 14

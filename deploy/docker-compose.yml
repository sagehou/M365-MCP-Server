services:
  m365-mcp:
    image: ${M365_MCP_IMAGE:?Set M365_MCP_IMAGE to a published version or digest}
    restart: unless-stopped
    ports:
      - "${MCP_BIND_ADDRESS:-127.0.0.1}:${MCP_PORT:-8000}:${MCP_PORT:-8000}"
    env_file:
      - .env
    volumes:
      - oauth-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os, urllib.request;
          urllib.request.urlopen('http://127.0.0.1:' + os.getenv('MCP_PORT', '8000') + '/healthz', timeout=3)
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  oauth-data:

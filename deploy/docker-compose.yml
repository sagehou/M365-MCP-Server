services:
  m365-mcp:
    image: ${M365_MCP_IMAGE:-ghcr.io/sagehou/m365-mcp-server:latest}
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
